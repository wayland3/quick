[package]
name = "quick"
version = "0.1.0"
description = "跨平台常驻效率工具"
authors = ["Quick Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset", "image-png"] }
tauri-plugin-global-shortcut = "2"
# 直接依赖以获得类型化的热键错误（Error::AlreadyRegistered），用于 T-607 热键可用性实测。
# 本就是 tauri-plugin-global-shortcut 的传递依赖，版本一致，不引入新包。
global-hotkey = "0.8"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
dirs = "7"
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
# PNG 编解码（全平台）：Windows 读取边界 DIB→PNG 归一化（T-612）与缩略图（T-613）
image = { version = "0.25", default-features = false, features = ["png"] }
# ICO 解析：Linux 下部分应用（如钉钉）的 .desktop Icon 指向 .ico 文件
ico = "0.6"
# 时间处理（快速转换功能）
chrono = "0.4"
# MD5 计算（快速转换功能）
md-5 = "0.10"
# URL 编码（启动器搜索兜底）
urlencoding = "2.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_UI_HiDpi",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    "Win32_System_Environment",
    "Win32_System_Shutdown",
    "Win32_UI_Accessibility",
] }

[target.'cfg(target_os = "linux")'.dependencies]
arboard = "3"
enigo = "0.2"
x11-clipboard = "0.9"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
